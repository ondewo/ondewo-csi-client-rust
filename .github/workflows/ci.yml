name: ci

# The generated stubs under src/api are COMMITTED, so CI compiles and tests the crate straight
# from the checkout: it needs neither docker nor the ondewo-rust-proto-compiler image. The
# ondewo-csi-api submodule IS checked out, because tests/api_surface.rs compares the committed
# stubs with the protos they were generated from. Regenerating the stubs is an integration
# concern - run `make build` locally. Every step below runs unconditionally: nothing here is
# allowed to skip itself into a green run, and the first job asserts the stubs are present.
on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

# The default GITHUB_TOKEN is read-write; nothing in this workflow writes to the repository, so
# it is narrowed to the one scope actions/checkout needs. A step that ever does need to write has
# to ask for it explicitly, in that job, where it is reviewable.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Files kept OUT of the coverage metric: src/api is machine output (it is exercised by the
  # tests, but it is not authored logic), and tests/ + examples/ are the measuring instrument.
  # What remains is exactly the hand-written library surface.
  COVERAGE_EXCLUDE_REGEX: (^|/)(src/api/|tests/|examples/)
  # Hand-written code is small and entirely ours, so nothing less than complete is acceptable.
  COVERAGE_MIN_LINES: "100"

jobs:
  build-and-test:
    name: build + test + publish dry run
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # tests/api_surface.rs reads the protos at the pinned API commit.
      - name: Check the ondewo-csi-api submodule out
        run: git submodule update --init ondewo-csi-api

      # Fail loudly rather than compile an empty crate: without this, a lost or unmerged src/api
      # turns every step below into a no-op that still exits 0.
      - name: Assert the generated stubs are committed
        run: |
          test -f src/api/mod.rs || { echo "::error::src/api/mod.rs is missing - the generated stubs are not committed"; exit 1; }
          stub_count=$(find src/api -name '*.rs' | grep -c . || true)
          test "$stub_count" -ge 2 || { echo "::error::src/api holds $stub_count rust files - the generated stubs are not committed"; exit 1; }
          echo "Found $stub_count generated rust files under src/api"

      - name: Install the rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version && cargo --version

      - name: Cache the cargo registry and the build directory
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # src/api is written by the proto compiler, not by hand: it is formatted by the generator
      # and is deliberately outside the rustfmt gate. The file count is asserted so that a future
      # path change cannot turn `-exec ... +` into a silent no-op.
      - name: Check the formatting of the hand-written sources
        run: |
          hand_written=$(find src tests examples -name '*.rs' -not -path 'src/api/*' | grep -c . || true)
          test "$hand_written" -ge 1 || { echo "::error::found no hand-written rust sources to format-check"; exit 1; }
          echo "Format-checking $hand_written hand-written rust files"
          find src tests examples -name '*.rs' -not -path 'src/api/*' -exec rustfmt --check --edition 2021 {} +

      - name: Build
        run: cargo build --release --locked

      # --all-targets also compiles examples/, which carry the crate's usage snippets.
      - name: Test
        run: cargo test --all-targets --locked

      # The generated doc comments carry raw URLs and raw HTML from the proto comments; the
      # crate-level allows in src/lib.rs are what keep this green.
      - name: Build the documentation
        run: cargo doc --no-deps --locked

      # The credential-free half of the crates.io release, run on every push so the packaging path
      # can never rot unnoticed between releases: the manifest fields crates.io demands, the exact
      # file list that would be uploaded, `cargo publish --dry-run` (which packages the crate and
      # compiles the packaged copy from scratch, stopping right before the upload), and the
      # server-side size limit that no dry run can see. The only thing left untested at release
      # time is the upload itself. The same target is what .github/workflows/release.yml runs
      # before it publishes.
      - name: Verify the crate publishes cleanly (dry run, no credentials)
        run: make publish_crate_dry_run

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # tests/api_surface.rs reads the protos at the pinned API commit.
      - name: Check the ondewo-csi-api submodule out
        run: git submodule update --init ondewo-csi-api

      - name: Install the rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          rustc --version && cargo --version

      - name: Cache the cargo registry and the build directory
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # --fail-under-lines is the gate: the build goes red the moment hand-written coverage drops
      # below COVERAGE_MIN_LINES.
      - name: Measure the coverage of the hand-written sources
        # `shell: bash` is what turns on pipefail - the default `bash -e` would let `tee` swallow
        # a failing --fail-under-lines and report the step as green.
        shell: bash
        run: |
          cargo llvm-cov --locked --summary-only \
            --ignore-filename-regex "$COVERAGE_EXCLUDE_REGEX" \
            --fail-under-lines "$COVERAGE_MIN_LINES" \
            | tee coverage-summary.txt

      # A regex that accidentally excluded everything would leave an empty report that
      # --fail-under-lines happily accepts, so assert the hand-written sources were measured.
      - name: Assert the hand-written sources were actually measured
        run: |
          grep -q 'auth\.rs' coverage-summary.txt || { echo "::error::the coverage report did not include the hand-written sources"; exit 1; }
          grep -q 'channel\.rs' coverage-summary.txt || { echo "::error::the coverage report did not include src/channel.rs"; exit 1; }

      # The generated stubs are excluded from the metric but must still be exercised; this run
      # records how much of them the suite touches, without gating on it.
      - name: Report the coverage of the generated stubs (not gated)
        run: |
          cargo llvm-cov report --summary-only --ignore-filename-regex '(^|/)(tests/|examples/)'

  lint:
    name: pre-commit
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout starts with a bare `git init`, and git >= 2.28 then prints a 13-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front is what silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # markdownlint-cli2 + the hygiene hooks from .pre-commit-config.yaml. The commit-msg
      # hooks (giticket, conventional-pre-commit) are not part of `run --all-files`.
      # pre-commit itself rather than pre-commit/action, which pins actions/cache@v4 on Node.js 20.
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.2

      - name: Cache the pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure --color=always
